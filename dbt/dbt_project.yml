# Step 12: dbt turns raw tables into clean, tested, documented models.
#   staging       1:1 with raw tables. Rename, cast, filter junk. Views (cheap).
#   intermediate  reusable building blocks (state spells). Tables.
#   marts         answers to questions, read by the dashboard. Tables.
name: dockwatch
version: "1.0.0"
profile: dockwatch
model-paths: ["models"]
test-paths: ["tests"]

models:
  dockwatch:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
