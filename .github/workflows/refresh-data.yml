# Refresh the project page data on GitHub's servers (they have internet access).
# Loads stations, ~2 minutes of live status, the latest month of rides,
# builds every dbt model, exports docs/data.json and commits it.
# Runs monthly on the 16th, or by hand from the Actions tab ("Run workflow").
name: refresh-data

on:
  workflow_dispatch:
    inputs:
      month:
        description: "YYYYMM or latest"
        default: latest
  schedule:
    - cron: "17 7 16 * *"
  push:
    paths: [".github/workflows/refresh-data.yml"]

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dockwatch
          POSTGRES_PASSWORD: dockwatch
          POSTGRES_DB: dockwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dockwatch" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_DSN: postgresql://dockwatch:dockwatch@localhost:5432/dockwatch
      DBT_HOST: localhost
      PGPASSWORD: dockwatch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt dbt-core==1.12.6 dbt-postgres==1.11.0
      - name: Create raw tables
        run: for f in sql/0*.sql; do psql -q -h localhost -U dockwatch -d dockwatch -f "$f"; done
      - name: Load station names
        run: python load_stations.py
      - name: Collect live status for about 2 minutes
        run: timeout 130 python poller.py || true
      - name: Load the latest month of rides
        run: python trips.py --month "${{ github.event.inputs.month || 'latest' }}"
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Export page data
        run: python export_page_data.py
      - name: Commit docs/data.json
        run: |
          git config user.name "Eesha Pandit"
          git config user.email "83364551+Eeshapandit@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Refresh page data"
          git pull --rebase origin main
          git push
